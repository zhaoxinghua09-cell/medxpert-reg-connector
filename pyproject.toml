[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medxpert-reg-connector"
version = "1.3.4"
description = "Read-only local MCP server: global medical-device regulatory knowledge hubs (NMPA/FDA/MDR/PMDA), 27 hubs, 7 tools, zero egress."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Steven Zhao" }]
keywords = ["medical-devices", "nmpa", "fda", "eu-mdr", "pmda", "regulatory", "mcp", "orthopedics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["fastmcp>=3.4,<5"]

[project.urls]
Homepage = "https://medxpert.cn"
Repository = "https://github.com/zhaoxinghua09-cell/medxpert-reg-connector"
"Official MCP Registry" = "https://registry.modelcontextprotocol.io/servers/io.github.zhaoxinghua09-cell%2Fmedxpert-reg-connector"

[project.scripts]
medxpert-reg-connector = "medxpert_reg_connector.server:main"

[tool.setuptools.packages.find]
include = ["medxpert_reg_connector*"]

[tool.setuptools.package-data]
# 知识库随包分发：pip/uvx 装完即可检索，无需另外克隆 references/
medxpert_reg_connector = [
  "data/*.json",
  "data/references/*.md",
]
