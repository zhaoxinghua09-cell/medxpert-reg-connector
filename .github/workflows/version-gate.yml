name: version gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # --no-deps: the gate reads importlib.metadata, which needs the distribution
      # installed but not its dependency tree; this keeps the job honest about
      # versions without turning a dependency-resolution failure into a gate verdict.
      - name: Install the package metadata (no dependency tree)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
      - name: Versions must agree across pyproject, manifest and runtime
        run: python tools/version_gate.py
