name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      # Re-running for an already registered version returns HTTP 400 "duplicate version",
      # which would paint a red X on a tag push that changes nothing. Ask the version endpoint
      # directly: `?search=` was measured returning the oldest version only, so it reported
      # "not registered" for versions that were already there.
      - name: Check whether this version is already registered
        id: check
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('server.json'))['name'])")
          VER=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          ENC=$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=''))" "$NAME")
          echo "checking $NAME@$VER"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$ENC/versions/$VER")
          if [ "$CODE" = "200" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::already registered (HTTP $CODE), publish skipped"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
            echo "not registered yet (HTTP $CODE), publishing"
          fi

      - name: Authenticate to MCP Registry
        if: steps.check.outputs.already_exists == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Wait until PyPI serves this version
        if: steps.check.outputs.already_exists == 'false'
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request
          raw = json.load(open("server.json", encoding="utf-8"))
          srv = raw[0] if isinstance(raw, list) else raw
          pkg = [p for p in srv.get("packages", []) if p.get("registryType") == "pypi"]
          if not pkg:
              print("no pypi package in server.json - nothing to wait for"); sys.exit(0)
          name, ver = pkg[0]["identifier"], pkg[0]["version"]
          want = "mcp-name: " + srv["name"]
          deadline = time.time() + 300
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/%s/json" % name, timeout=20) as r:
                      d = json.loads(r.read())
              except Exception as e:
                  print("pypi not reachable yet: %s" % e); time.sleep(15); continue
              files = (d.get("releases") or {}).get(ver, [])
              desc = (d.get("info") or {}).get("description") or ""
              if files and want in desc:
                  print("OK: %s %s has %d files and the ownership marker" % (name, ver, len(files)))
                  sys.exit(0)
              print("%s %s not ready yet (files=%d, marker=%s)" % (name, ver, len(files), want in desc))
              time.sleep(15)
          print("TIMEOUT: %s %s never appeared on PyPI with the ownership marker" % (name, ver))
          sys.exit(1)
          PY

      - name: Publish server to MCP Registry
        if: steps.check.outputs.already_exists == 'false'
        run: ./mcp-publisher publish
