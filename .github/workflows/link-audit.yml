name: link-audit

on:
  schedule:
    - cron: "0 1 * * 1"   # Monday 01:00 UTC / 每周一 09:00 CST
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe the registered official sources
        run: python tools/check_sources.py | tee link-audit.txt
      - name: Keep the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: link-audit-${{ github.run_id }}
          path: link-audit.txt
