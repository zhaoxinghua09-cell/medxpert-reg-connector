name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: Contract self-test (MCP stdio)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Show bundled knowledge base
        run: |
          python -c "
          import pathlib
          from medxpert_reg_connector.server import REFS_DIR
          n = len(list(pathlib.Path(REFS_DIR).glob('*.md')))
          print(REFS_DIR)
          print(n, 'md files')
          "
      - name: Version consistency across manifests
        run: python tools/version_check.py

      - name: Contract self-test
        run: python tests/selftest_stdio.py
