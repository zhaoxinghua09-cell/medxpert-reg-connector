name: Publish to PyPI

# Two supported routes:
#   1) Token route (default today): repository secret PYPI_API_TOKEN, an API token with
#      upload scope from the PyPI account. Works immediately, no PyPI-side setup.
#   2) OIDC route (preferred long term, zero secrets): PyPI -> Account -> Publishing ->
#      Add a pending publisher (project medxpert-reg-connector, owner zhaoxinghua09-cell,
#      repo medxpert-reg-connector, workflow publish-pypi.yml, environment pypi).
#      Once that exists, switch the publish step back to `uses: pypa/gh-action-pypi-publish@release/v1`
#      with `permissions: id-token: write` and drop the `with: password`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Show artifacts
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/medxpert-reg-connector
    steps:
      # A GitHub Release can be cut for a version that is already on PyPI (for example
      # when the upload happened outside CI). PyPI rejects a duplicate file with 400,
      # so check first instead of painting the release red.
      - name: Check whether this version is already on PyPI
        id: check
        run: |
          NAME=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])" 2>/dev/null || echo medxpert-reg-connector)
          VER=$(python3 -c "import zipfile,glob;print(glob.glob('dist/*.whl')[0].split('-')[1])")
          echo "checking $NAME $VER on PyPI"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$NAME/$VER/json")
          if [ "$CODE" = "200" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::version $VER already on PyPI, publish skipped"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.already_exists == 'false'
        with:
          name: dist
          path: dist/
      - name: Publish
        if: steps.check.outputs.already_exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
