name: Publish to PyPI

# Two supported routes:
#   1) Token route (default today): repository secret PYPI_API_TOKEN, an API token with
#      upload scope from the PyPI account. Works immediately, no PyPI-side setup.
#   2) OIDC route (preferred long term, zero secrets): PyPI -> Account -> Publishing ->
#      Add a pending publisher (project medxpert-reg-connector, owner zhaoxinghua09-cell,
#      repo medxpert-reg-connector, workflow publish-pypi.yml, environment pypi).
#      Once that exists, switch the publish step back to `uses: pypa/gh-action-pypi-publish@release/v1`
#      with `permissions: id-token: write` and drop the `with: password`.
#
# Note: a `release` event runs the workflow file that exists at the tag, not at the default
# branch. Run this from the default branch (workflow_dispatch) when publishing an artifact
# that was already released earlier.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      already_exists: ${{ steps.ver.outputs.already_exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A GitHub Release can be cut for a version that is already on PyPI (for example
      # when the upload happened outside CI). PyPI rejects duplicate files, so check first
      # instead of painting the release red.
      - name: Read version and check PyPI
        id: ver
        run: |
          NAME=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          VER=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$NAME/$VER/json")
          echo "PyPI $NAME $VER -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "already_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME $VER already on PyPI, publish will be skipped"
          else
            echo "already_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Show artifacts
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.already_exists != 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/medxpert-reg-connector
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
